name: Commit City

on:
  schedule:
    - cron: '23 6 * * *'   # every morning, UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg

      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/fetch.mjs

      - name: Render frames
        run: python scripts/render.py --frames 150 --out out/frames

      - name: Assemble the loop
        run: python scripts/assemble.py

      - name: Commit the new city
        run: |
          git config user.name 'commit-city[bot]'
          git config user.email 'commit-city@users.noreply.github.com'
          git add city/commit-city.webp city/commit-city.png city/data.json
          git diff --cached --quiet || git commit -m 'Rebuild commit city'
          git push
