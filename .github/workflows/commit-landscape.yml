name: Commit Landscape

on:
  schedule:
    - cron: '23 6 * * *'   # every morning, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-landscape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public commit activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 landscape/scripts/fetch_activity.py --user "$GITHUB_REPOSITORY_OWNER"

      - name: Draw the SVG landscape
        run: python3 landscape/scripts/generate.py

      - name: Commit the refreshed landscape
        env:
          LANDSCAPE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'commit-landscape[bot]'
          git config user.email 'commit-landscape@users.noreply.github.com'
          git add landscape/data/activity.json landscape/assets/nocturne.svg landscape/assets/nocturne-still.svg
          if git diff --cached --quiet; then
            echo 'The landscape is already up to date.'
            exit 0
          fi
          git commit -m 'Refresh commit landscape'

          # Reapply this generated-files commit over concurrent profile updates.
          # A normal push rejects any intervening change instead of overwriting it.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$LANDSCAPE_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:refs/heads/$LANDSCAPE_BRANCH"; then
              exit 0
            fi
          done
          echo 'Could not publish after three attempts; remote changes were preserved.' >&2
          exit 1
